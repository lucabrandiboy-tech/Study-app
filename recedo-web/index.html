<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Recedo</title>
<meta name="theme-color" content="#2a2a30">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #333338; color: #ddd; font: 15px system-ui, sans-serif; }
  /* The pen and fingers draw; the page itself never scrolls, zooms or selects. */
  #recedo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
  #status.error { color: #ffb4a8; }
</style>
</head>
<body>
<canvas id="recedo" tabindex="0"></canvas>
<div id="status">Loading Recedo…</div>
<script type="module">
  import init from "./recedo_web.js";
  init().catch(e => { const s = document.getElementById("status"); s.textContent = "Recedo could not start: " + e; s.className = "error"; });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
