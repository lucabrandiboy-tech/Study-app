[package]
name = "wintab-mock"
description = "Test double for Wintab32.dll used by Recedo's automated tests (not shipped)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "wintab_mock"
crate-type = ["cdylib", "rlib"]

[dependencies]
recedo-tablet = { path = "../recedo-tablet" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_SystemInformation"] }
