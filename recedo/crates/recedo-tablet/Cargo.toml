[package]
name = "recedo-tablet"
description = "Pen tablet input for Recedo: Wintab and Windows Ink, sample model, mapping and statistics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
web-time = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_Pointer", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_System_Performance", "Win32_UI_HiDpi"] }
