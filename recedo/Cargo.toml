[workspace]
resolver = "3"
members = ["crates/recedo-app", "crates/recedo-core", "crates/recedo-render", "crates/recedo-tablet", "crates/recedo-tabletest", "crates/recedo-web", "crates/recedo-win", "crates/wintab-mock"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12", "vulkan", "gles", "wgsl", "std", "parking_lot"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
pollster = "0.4"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
windows-sys = { version = "0.61" }

[profile.release]
opt-level = 3
debug = false
strip = true
# The whole program optimised as one (inlining across crates): faster painting and
# compositing, a smaller browser app, slower release builds.
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
